name: Landing quality gates and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Concurrency is per job: a production run waiting for approval must not block checks on newer commits.
    concurrency:
      group: quality-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    services:
      pilot-db:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: delir_test
          # Disposable CI fixture only; no production access or credentials.
          MARIADB_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (including build and test tooling)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Verify deployment isolation and rollback
        run: python3 scripts/test-deploy-ionos.py
      - name: Validate IONOS PHP intake and MariaDB transactions
        env:
          DELIR_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=delir_test;charset=utf8mb4
          DELIR_TEST_USER: root
          DELIR_TEST_PASSWORD: test-only-password
        run: |
          php -l public/api/pilot.php
          php -l public/index.php
          php -l server/ionos/pilot.php
          php -l server/ionos/config.example.php
          php -l server/ionos/maintenance.php
          php -l public/api/waitlist.php
          php -l server/ionos/waitlist.php
          php -l server/ionos/interest-metrics.php
          php server/ionos/tests.php --require-db
          php server/ionos/waitlist-tests.php --require-db
      - name: Build IONOS release with pilot and waitlist intake
        run: npm run build
        # Build settings must not override isolated unit-test fixtures.
        env:
          VITE_PRIVACY_NOTICE_READY: 'true'
          VITE_PRIVACY_NOTICE_URL: /privacy
          VITE_PILOT_ENDPOINT: /api/pilot.php
          VITE_LEAD_CAPTURE_READY: 'true'
          VITE_WAITLIST_READY: 'true'
          VITE_WAITLIST_ENDPOINT: /api/waitlist.php
          VITE_ANALYTICS_READY: 'true'
          VITE_GA_MEASUREMENT_ID: G-6D2FN0HCDS
      - name: Identify the tested frontend release
        run: |
          python3 -c 'import json, os; from pathlib import Path; Path("dist/release.json").write_text(json.dumps({"sha": os.environ["GITHUB_SHA"]}))'
      - name: Keep the tested build for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true
          retention-days: 7
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_WAITLIST_ENABLED: 'true'
      - name: Build isolated enabled-waitlist fixture
        run: npx vite build --configLoader runner --outDir dist-interest
        env:
          VITE_PRIVACY_NOTICE_READY: 'true'
          VITE_PRIVACY_NOTICE_URL: /privacy
          VITE_LEAD_CAPTURE_READY: 'true'
          VITE_WAITLIST_READY: 'true'
          VITE_WAITLIST_ENDPOINT: /api/waitlist.php
          VITE_ANALYTICS_READY: 'false'
      - name: Verify the enabled waitlist flow with simulated responses
        run: npx playwright test e2e/product-interest.spec.ts --project=chromium --project=mobile-chrome --project=mobile-safari
        env:
          PLAYWRIGHT_INTEREST_FIXTURE: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4181
      - run: npm run test:lighthouse
      - run: npm run test:lighthouse:mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: |
            coverage
            playwright-report
            lighthouse-report

  deploy-ionos:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_IONOS_DEPLOYMENTS == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ionos-production
      url: https://delir.it
    concurrency:
      group: ionos-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Skip releases superseded by a newer main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this older release will not overwrite it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install the isolated SFTP client
        if: steps.current.outputs.publish == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/ionos-deploy-venv"
          "$RUNNER_TEMP/ionos-deploy-venv/bin/python" -m pip install --upgrade 'pip==26.2.1'
          "$RUNNER_TEMP/ionos-deploy-venv/bin/python" -m pip install 'paramiko==5.0.0'
      - name: Publish the tested frontend and waitlist entrypoint, then verify delir.it
        if: steps.current.outputs.publish == 'true'
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_FINGERPRINT: ${{ secrets.IONOS_SFTP_FINGERPRINT }}
          IONOS_SFTP_DIRECTORY: ${{ vars.IONOS_SFTP_DIRECTORY }}
          IONOS_SFTP_PORT: '22'
        run: |
          "$RUNNER_TEMP/ionos-deploy-venv/bin/python" scripts/deploy-ionos.py
          echo "Published and verified https://delir.it at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # Uploads a non-live version of the production Worker with its own preview URL.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.ENABLE_CLOUDFLARE_PREVIEWS == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip when Cloudflare secrets are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets not set, preview skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          name: dist
          path: dist
      - name: Upload preview version
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        shell: bash
        run: |
          npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }}" | tee upload.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | head -1 || true)
          echo "Preview: ${url:-not reported by wrangler}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_CLOUDFLARE_DEPLOYMENTS == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Cloudflare secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx wrangler deploy --env staging

  # Add required reviewers to the "production" environment in GitHub settings to gate this step manually.
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx wrangler deploy --message "${{ github.sha }}"
